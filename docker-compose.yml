services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-stocks}"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.2-python3.12
    command: standalone            # dev mode: scheduler + webserver in one container
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      PYTHONPATH: /opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow psycopg2-binary requests"
    ports: ["8080:8080"]
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && gunicorn -b 0.0.0.0:5000 dashboard.app:app"
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports: ["5000:5000"]
    volumes: [".:/app"]

volumes:
  pgdata:
  airflow_home:
